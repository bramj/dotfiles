"$schema" = 'https://starship.rs/config-schema.json'

# Mirrors the old powerlevel10k lean prompt: dir, git and ❯ on the left;
# duration, Python venv, user@host, kube context, Node version and time on the right.
# $username and $hostname only show when root or over SSH.
format = "$directory$git_branch$git_state$git_status$character"
right_format = "$cmd_duration$python$username$hostname$kubernetes$nodejs$time"

[character]
success_symbol = "[❯](bold #FF6AC1)"
error_symbol = "[❯](bold #FF5C57)"

[kubernetes]
disabled = false

[time]
disabled = false
format = "[$time]($style)"
